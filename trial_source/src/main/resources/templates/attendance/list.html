<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{/common/layout :: layout(~{::title},~{::body/content()})}">

<head>
	<meta charset="UTF-8">
	<title>勤怠情報確認（受講生一覧）｜LMS</title>
	<script type="text/javascript" src="../../static/js/jquery.2.1.1.min.js"></script>
	<script type="text/javascript" src="../../static/js/jquery.dataTables.min.js"></script>
	<script type="text/javascript" src="../../static/js/dataTables.bootstrap.min.js"></script>
	<script type="text/javascript" src="../../static/js/bootstrap-datepicker.min.js"></script>
	<script type="text/javascript" src="../../static/js/bootstrap-datepicker.ja.min.js"></script>
	<script type="text/javascript" src="../../static/js/lms_common.js"></script>
	<script type="text/javascript" src="../../static/js/jstree.min.js"></script>
	<script type="text/javascript" src="../../static/js/currency.js"></script>
	<script type="text/javascript" src="../../static/js/bootstrap.min.js"></script>
</head>
<!--布村沙英 -Task.57-->
<body>
	<div id="wrap">

		<div class="container">

			<div id="contents" class="clearfix">
				<div id="main" class="main2clm">

					<h2>勤怠情報確認<small>（受講生一覧）</small></h2>

					<div class="well bs-component">
						<form th:action="@{/attendance/list}" method="get" th:object="${searchStudentForm}"
							class="form-horizontal">
							<fieldset>
								<legend>検索</legend>
								<div class="form-group">
									<label for="courseId" class="col-lg-2 control-label">コース名</label>
									<div class="col-lg-10">

										<select th:name="courseId" class="form-control">
											<option th:each="course : *{courseMap}" th:value="${course.key}"
												th:inline="text" class="form-control" th:text="${course.value}">
											</option>
										</select>


									</div>
								</div>
								<div class="form-group">
									<label for="placeId" class="col-lg-2 control-label">会場名</label>
									<div class="col-lg-10">

										<select th:name="placeId" class="form-control" readonly="readonly">
											<option th:each="place : *{placeMap}" th:value="${place.key}"
												th:inline="text" class="form-control" th:text="${place.value}"
												readonly="readonly">
											</option>
										</select>
									</div>
								</div>
								<div class="form-group">
									<label for="companyId" class="col-lg-2 control-label">企業名</label>
									<div class="col-lg-10">

										<select th:name="companyId" class="form-control">
											<option th:each="company : *{companyMap}" th:value="${company.key}"
												th:inline="text" class="form-control" th:text="${company.value}">
											</option>
										</select>

									</div>
								</div>

								<div class="form-group">
									<label for="userName" class="col-lg-2 control-label">ユーザー名</label>
									<div class="col-lg-10">
										<input type="text" name="userName" value="" id="userName" class="form-control">

									</div>
								</div>

								<div class="form-group">
									<div class="col-lg-10 col-lg-offset-2">
										<input type="submit" name="search" value="検索" class="btn btn-primary">
									</div>
								</div>
							</fieldset>
						</form>
					</div>


					<div id="DataTables_Table_0_wrapper" class="dataTables_wrapper form-inline dt-bootstrap no-footer">
						<div class="row">
							<div class="col-sm-6">
								<div class="dataTables_length" id="DataTables_Table_0_length">

								</div>
							</div>
							<div class="col-sm-6"></div>
						</div>
						<div class="row">
							<div class="col-sm-12">
								<table class="table table-hover sortabletable dataTable no-footer"
									id="DataTables_Table_0" role="grid" aria-describedby="DataTables_Table_0_info">
									<thead>
										<tr role="row">
											<th class="sorting_asc" tabindex="0" aria-controls="DataTables_Table_0"
												rowspan="1" colspan="1" aria-sort="ascending"
												aria-label="ユーザーID: activate to sort column descending">ユーザーID</th>
											<th class="sorting" tabindex="0" aria-controls="DataTables_Table_0"
												rowspan="1" colspan="1"
												aria-label="ユーザー名: activate to sort column ascending">ユーザー名</th>
											<th class="sorting" tabindex="0" aria-controls="DataTables_Table_0"
												rowspan="1" colspan="1"
												aria-label="コース名: activate to sort column ascending">コース名</th>
											<th class="sorting" tabindex="0" aria-controls="DataTables_Table_0"
												rowspan="1" colspan="1"
												aria-label="企業名: activate to sort column ascending">企業名</th>
											<th class="sorting" tabindex="0" aria-controls="DataTables_Table_0"
												rowspan="1" colspan="1"
												aria-label="会場: activate to sort column ascending">会場</th>
											<th class="sorting" tabindex="0" aria-controls="DataTables_Table_0"
												rowspan="1" colspan="1"
												aria-label="勤怠: activate to sort column ascending">勤怠</th>
										</tr>
									</thead>
									<tbody>
										<th:block th:each="searchStudentDto : ${searchStudentDtoList}">
											<tr role="row" class="odd">
												<td class="sorting_1" th:text="${searchStudentDto.lmsUserId}"></td>
												<td th:text="${searchStudentDto.userName}"></td>
												<td th:text="${searchStudentDto.courseName}"></td>
												<td th:text="${searchStudentDto.companyName}"></td>
												<td th:text="${searchStudentDto.placeName}"><small>（$$）</small></td>
												<td>
													<form name="attendance_updateActionForm" method="post"
														th:action="@{/attendance/detail}">
														<input type="hidden" th:name="courseId"
															th:value="${searchStudentDto.courseId}">
														<input type="hidden" th:name="lmsUserId"
															th:value="${searchStudentDto.lmsUserId}">
														<input type="hidden" th:name="userName"
															th:value="${searchStudentDto.userName}">
														<input type="hidden" th:name="companyName"
															th:value="${searchStudentDto.companyName}">
														<input type="hidden" th:name="courseName"
															th:value="${searchStudentDto.courseName}">
														<input type="hidden" th:name="placeName"
															th:value="${searchStudentDto.placeName}">
														<input type="submit" name="attendance_updateActionForm"
															value="勤怠確認" class="btn btn-default">
													</form>
												</td>
										</th:block>

										</tr>
									</tbody>
								</table>
							</div>
						</div>
						<div class="row">
							<div class="col-sm-5">
							</div>
							<div class="col-sm-7">
								<div class="dataTables_paginate paging_simple_numbers" id="DataTables_Table_0_paginate">
								</div>
							</div>
						</div>
					</div>


				</div>
				<!--#main-->
			</div>
			<!--#contents-->
			<form id="screenTransForm" name="screenTransForm" method="post">
			</form>
			<div id="push"></div>
		</div>
	</div>

</body>

</html>
