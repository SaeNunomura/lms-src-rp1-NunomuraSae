<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{/common/layout :: layout(~{::title},~{::body/content()})}">

<head>
	<meta charset="UTF-8">
	<title>勤怠情報変更｜LMS</title>
</head>

<body>

	<th:block th:if="${session.loginUserDto.role == '0001'}" th:object="${attendanceForm}">
		<h2>勤怠管理</h2>
		<p th:each="dailyAttendanceForm, stat : ${attendanceForm.attendanceList}">
			<!-- 布村沙英 -Task.27-->
			<span th:errors="*{attendanceList[__${stat.index}__].note}" class="help-inline error"></span>
			<span th:errors="*{attendanceList[__${stat.index}__].trainingStartTimeHour}"
				class="help-inline error"></span>
			<span th:errors="*{attendanceList[__${stat.index}__].trainingStartTimeMin}"
				class="help-inline error"></span>
			<span th:errors="*{attendanceList[__${stat.index}__].trainingEndTimeHour}" class="help-inline error"></span>
			<span th:errors="*{attendanceList[__${stat.index}__].trainingEndTimeMin}" class="help-inline error"></span>
			<span th:errors="*{attendanceList[__${stat.index}__].trainingStartTime}" class="help-inline error"></span>
			<span th:errors="*{attendanceList[__${stat.index}__].trainingEndTime}" class="help-inline error"></span>
			<span th:errors="*{attendanceList[__${stat.index}__].blankTime}" class="help-inline error"></span>
		</p>
	</th:block>

	<th:block th:if="${session.loginUserDto.role != '0001'}">
		<h2>勤怠管理 <small>( [[${attendanceForm.userName}]] )</small></h2>
		<th:block th:if="${session.loginUserDto.leaveFlg == '1'}">
			<h2><small>途中退校日：${dispLeaveDate}</small></h2>
		</th:block>
	</th:block>

	<div class="row">
		<div class="bs-component col-sm-12">

			<form th:action="@{/attendance/update}" method="post" th:object="${attendanceForm}">
				<table class="table table-hover dataTable no-footer">
					<!-- 布村沙英 -Task.29-->
					<thead style="display: block;">
						<tr>
							<th class="w140">日付</th>
							<th class="w140">コース内容</th>
							<!-- 布村沙英 -Task.26-->
							<th class="w60"></th>
							<th class="w180" colspan="3">出勤</th>
							<th class="w180" colspan="3">退勤</th>
							<th class="w80">中抜け時間</th>
							<th class="w70">ステータス</th>
							<th class="w140">備考</th>
						</tr>
					</theadstyle="display: block;">
					<!-- 布村沙英 -Task.29-->
					<tbody style="display: block; overflow-y: scroll; height: 560px;">
						<th:block th:each="dailyAttendanceForm, stat : *{attendanceList}">
							<tr>
								<th:block>
									<input type="hidden" th:name="|attendanceList[${stat.index}].isToday|"
										th:value="${dailyAttendanceForm.isToday}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].studentAttendanceId|"
										th:value="${dailyAttendanceForm.studentAttendanceId}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].trainingDate|"
										th:value="${dailyAttendanceForm.trainingDate}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].dispTrainingDate|"
										th:value="${dailyAttendanceForm.dispTrainingDate}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].sectionName|"
										th:value="${dailyAttendanceForm.sectionName}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].statusDispName|"
										th:value="${dailyAttendanceForm.statusDispName}" />
								</th:block>
								<td class="w140">[[${dailyAttendanceForm.dispTrainingDate}]]</td>
								<td class="w140">[[${dailyAttendanceForm.sectionName}]]</td>
								<td class="w60"><input type="button" class="btn btn-success"
										th:id="|regular-${stat.index}|" value="定時" /></td>
								<td class="w70">
									<!-- 布村沙英 -Task.26-->
									<select th:name="|attendanceList[${stat.index}].trainingStartTimeHour|"
										class="form-control" th:id="|start-time-hour-${stat.index}|" th:classappend="${
            							#fields.hasErrors('attendanceList[' + stat.index + '].trainingStartTimeHour')
            							or
           								 #fields.hasErrors('attendanceList[' + stat.index + '].trainingStartTime') } ? ' errorInput'">
										<option th:each="trainingStartHour : ${attendanceForm.trainingStartHourMap}"
											th:value="${trainingStartHour.key}" th:inline="text" class="form-control"
											th:selected="${trainingStartHour.key == dailyAttendanceForm.trainingStartTimeHour}">
											[[${trainingStartHour.value}]]</option>
									</select>
								</td>
								<td>:</td>
								<td class="w70">
									<!-- 布村沙英 -Task.26-->
									<select th:name="|attendanceList[${stat.index}].trainingStartTimeMin|"
										class="form-control" th:id="|start-time-min-${stat.index}|" th:classappend="${
            							#fields.hasErrors('attendanceList[' + stat.index + '].trainingStartTimeMin')
            							or
           								 #fields.hasErrors('attendanceList[' + stat.index + '].trainingStartTime') } ? ' errorInput'">
										<option th:each="trainingStartMin : ${attendanceForm.trainingStartMinMap}"
											th:value="${trainingStartMin.key}" th:inline="text" class="form-control"
											th:selected="${trainingStartMin.key == dailyAttendanceForm.trainingStartTimeMin}">
											[[${trainingStartMin.value}]]</option>
									</select>
								</td>
								<td class="w70">
									<!-- 布村沙英 -Task.26-->
									<select th:name="|attendanceList[${stat.index}].trainingEndTimeHour|"
										class="form-control" th:id="|end-time-hour-${stat.index}|" th:classappend="${
            							#fields.hasErrors('attendanceList[' + stat.index + '].trainingEndTimeHour')
            							or
           								 #fields.hasErrors('attendanceList[' + stat.index + '].trainingEndTime') } ? ' errorInput'">
										<option th:each="trainingEndHour : ${attendanceForm.trainingEndHourMap}"
											th:value="${trainingEndHour.key}" th:inline="text" class="form-control"
											th:selected="${trainingEndHour.key == dailyAttendanceForm.trainingEndTimeHour}">
											[[${trainingEndHour.value}]]</option>
									</select>
								</td>
								<td>:</td>
								<td class="w70">
									<!-- 布村沙英 -Task.26-->
									<select th:name="|attendanceList[${stat.index}].trainingEndTimeMin|"
										class="form-control" th:id="|end-time-min-${stat.index}|" th:classappend="${
            							#fields.hasErrors('attendanceList[' + stat.index + '].trainingEndTimeMin')
            							or
           								 #fields.hasErrors('attendanceList[' + stat.index + '].trainingEndTime') } ? ' errorInput'">
										<option th:each="trainingEndMin : ${attendanceForm.trainingEndMinMap}"
											th:value="${trainingEndMin.key}" th:inline="text" class="form-control"
											th:selected="${trainingEndMin.key == dailyAttendanceForm.trainingEndTimeMin}">
											[[${trainingEndMin.value}]]</option>
									</select>
								</td>
								<td class="w80">
									<select th:name="|attendanceList[${stat.index}].blankTime|" class="form-control"
										th:classappend="${#fields.hasErrors('attendanceList[' + stat.index + '].blankTime')} ? ' errorInput'">
										<option th:each="blankTime : ${attendanceForm.blankTimes}"
											th:value="${blankTime.key}" th:inline="text" class="form-control"
											th:selected="${blankTime.key == dailyAttendanceForm.blankTime}">
											[[${blankTime.value}]]</option>
									</select>
								</td>
								<td class="w70">[[${dailyAttendanceForm.statusDispName}]]</td>
								<td class="w140">
									<input type="text" th:name="|attendanceList[${stat.index}].note|"
										th:value="${dailyAttendanceForm.note}" class="form-control"
										th:classappend="${#fields.hasErrors('attendanceList[' + stat.index + '].note')} ? ' errorInput'"></input>
								</td>
							</tr>
						</th:block>
					</tbody>
				</table>

				<div class="form-group">
					<th:block th:if="${session.loginUserDto.role == '0001'}">
						<a th:href="@{/attendance/detail}" class="btn btn-default">戻る</a>
					</th:block>
					<th:block th:if="${session.loginUserDto.role != '0001'}">
						<input type="submit" value="戻る" name="indexCompany" class="btn btn-default" />
					</th:block>
					<input type="submit" value="更新" name="complete" class="btn btn-info"
						onclick="return registCheck();" />
				</div>

			</form>
		</div>
	</div>


	<script>
		function registCheck() {
			if (confirm("更新します。よろしいですか？")) {
				return true;
			}
			else {
				return false;
			}
		}
	</script>

	<!-- 布村沙英 -Task.28-->
	<script>
		//HTMLが読み込まれたタイミングで実行
		document.addEventListener("DOMContentLoaded", () => {
			//「regular-」から始まるidを取得し、定数buttonsに格納(全行の定時ボタンを取得)
			const buttons = document.querySelectorAll("[id^='regular-']");
			//buttonsに格納された要素を一つずつ取り出しbtnに格納(それぞれの行の定時ボタンを取得)
			buttons.forEach(btn => {
				//btnがclickされた時に{}内の処理を実行
				btn.addEventListener("click", () => {
					//定時ボタンのid属性名を「-」で区切って配列化、その後1番目の要素を定数indexに格納
					const index = btn.id.split("-")[1];
					//定時ボタンが押下された行のそれぞれのセレクトボックスをindexから特定、値を入れる
					document.getElementById(`start-time-hour-${index}`).value = "9";
					document.getElementById(`start-time-min-${index}`).value = "0";
					document.getElementById(`end-time-hour-${index}`).value = "18";
					document.getElementById(`end-time-min-${index}`).value = "0";
				});
			});
		});
	</script>


</body>

</html>
