<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{/common/layout :: layout(~{::title},~{::body/content()})}">

<head>
	<meta charset="UTF-8">
	<title>勤怠一括登録｜LMS</title>
	<script type="text/javascript" th:src="@{/js/jquery.2.1.1.min.js}"></script>
	<script type="text/javascript" th:src="@{/js/jquery.dataTables.min.js}"></script>
	<script type="text/javascript" th:src="@{/js/dataTables.bootstrap.min.js}"></script>
	<script type="text/javascript" th:src="@{/js/bootstrap-datepicker.min.js}"></script>
	<script type="text/javascript" th:src="@{/js/bootstrap-datepicker.ja.min.js}"></script>
	<script type="text/javascript" th:src="@{/js/lms_common.js}"></script>
	<script type="text/javascript" th:src="@{/js/jstree.min.js}"></script>
	<script type="text/javascript" th:src="@{/js/currency.js}"></script>
	<script type="text/javascript" th:src="@{/js/bootstrap.min.js}"></script>
	<script type="text/javascript" th:src="@{/js/companyAttendance.js}"></script>

	<script>
		$(function () {
			$(document).on("click", "#submit-btn", function () {
				var targetIndex = $(this).val();
				$("#targetIndex").val(targetIndex);
				var i = 0;

				var index = document.getElementsByName(
					"dailyAttendanceFormList[" + i + "].index"
				)[0].value;
				if (targetIndex != index) {
					document.getElementsByName(
						"dailyAttendanceFormList[" + i + "].trainingStartTime"
					)[0].value = null;
					document.getElementsByName(
						"dailyAttendanceFormList[" + i + "].trainingEndTime"
					)[0].value = null;
					document.getElementsByName(
						"dailyAttendanceFormList[" + i + "].isAbsent"
					)[0].checked = false;
				}
				i++;

				$("#registForm").submit();
			});
		});
	</script>
</head>

<body>
	<div class="container">
		<div id="contents" class="clearfix">
			<div id="main" class="main2clm">
				<h2>勤怠一括登録</h2>

				<form name="attendance_bulkRegist_listActionForm" th:action="@{/attendance/bulkRegist/search}"
					th:object="${bulkRegistForm}" method="post" class="form-horizontal">

					<div>
						<input type="hidden" name="org.apache.struts.taglib.html.TOKEN"
							value="c561a5fd29ca16c8536bb77fad2738bc" />
					</div>
					<div class="well bs-component">
						<fieldset>
							<legend>検索</legend>
							<div class="form-group">
								<label for="placeName" class="col-lg-2 control-label">期間</label>
								<div class="col-lg-10 form-inline">
									<input type="text" th:field="*{searchPeriodFrom}" id="searchFrom"
										style="width: 10em" class="form-control datepickerFrom"
										th:classappend="${#fields.hasErrors('searchPeriodFrom') or #fields.hasErrors('searchPeriod')} ? ' errorInput'" />　～　
									<input type="text" th:field="*{searchPeriodTo}" id="searchTo" style="width: 10em"
										class="form-control datepickerTo"
										th:classappend="${#fields.hasErrors('searchPeriodTo') or #fields.hasErrors('searchPeriod')} ? ' errorInput'" />
								</div>
							</div>

							<div class="form-group">
								<label for="placeName" class="col-lg-2 control-label">会場名</label>
								<div class="col-lg-10">
									<select name="placeId" id="placeId" class="form-control">
										<option value=""></option>
										<option th:value="*{placeId}" th:text="*{placeName}">
										</option>
									</select>
								</div>
							</div>

							<div class="form-group">
								<div class="col-lg-10 col-lg-offset-2">
									<input type="submit" name="search" value="検索" class="btn btn-primary" />
								</div>
							</div>
						</fieldset>
					</div>
				</form>
				<p th:object="${bulkRegistForm}">
					<span th:errors="*{searchPeriodFrom}" class="error"></span><br>
					<span th:errors="*{searchPeriodTo}" class="error"></span><br>
					<span th:errors="*{searchPeriod}" class="error"></span>
				</p>

				<!--ここまで初期表示-->
				<th:block th:unless="${#lists.isEmpty(dailyAttendanceFormList)}">
					<th:block th:object="${bulkRegistForm}">
						<p th:each="dailyAttendanceForm , stat : ${bulkRegistForm.dailyAttendanceFormList}">
							<span th:errors="*{dailyAttendanceFormList[__${stat.index}__].absent}"
								class="help-inline error"></span>
							<span th:errors="*{dailyAttendanceFormList[__${stat.index}__].trainingTimeFormat}"
								class="help-inline error"></span>
							<span th:errors="*{dailyAttendanceFormList[__${stat.index}__].trainingStartTime}"
								class="help-inline error"></span>
							<span th:errors="*{dailyAttendanceFormList[__${stat.index}__].trainingEndTime}"
								class="help-inline error"></span>
							<span th:errors="*{dailyAttendanceFormList[__${stat.index}__].trainingTimeRange}"
								class="help-inline error"></span>
						</p>
					</th:block>
					<form th:action="@{/attendance/bulkRegist/complete}" method="post">
						<th:block th:object="${bulkRegistForm}">
							<input type="hidden" th:field="*{searchPeriodFrom}">
							<input type="hidden" th:field="*{searchPeriodTo}">
							<input type="hidden" th:field="*{placeId}">
						</th:block>

						<table class="table">
							<tbody>
								<th:block th:each="dailyAttendanceForm, stat : ${dailyAttendanceFormList}">
									<th:block
										th:if="${stat.first or dailyAttendanceForm.dispTrainingDate != dailyAttendanceFormList[__${stat.index-1}__].dispTrainingDate}">

										<tr style="
				                      background-color: #f5f5f5;
				                      border-top-style: solid;
				                      border-width: medium;
				                    ">
											<th colspan="7" th:text="${dailyAttendanceForm.dispTrainingDate}"></th>
											<th colspan="2">
												<button type="button" th:value="${stat.index}"
													class="btn btn-default copyAttendanceDaily">
													受講生が入力した時刻をコピーする
												</button>
											</th>
											<td>
												<button id="submit-btn" type="submit" name="complete" value="0"
													class="btn btn-info">
													確定する
												</button>
												<input type="hidden" name="targetIndex" value="" id="targetIndex" />
											</td>
										</tr>
										<tr>
											<th style="width: 120px">ユーザー名</th>
											<th style="width: 190px">コース名</th>
											<th style="width: 90px">出勤</th>
											<th style="width: 90px">退勤</th>
											<th style="width: 90px">中抜け時間</th>
											<th style="width: 90px">ステータス</th>
											<th style="width: 50px">備考</th>
											<th style="width: 90px">開始時間</th>
											<th style="width: 90px">終了時間</th>
											<th style="width: 50px">欠席</th>
										</tr>
									</th:block>

									<tr th:object="${dailyAttendanceForm}">
										<td th:text="*{userName}"></td>
										<td th:text="*{courseName}"></td>
										<td th:text="*{trainingStartTime}"></td>
										<td th:text="*{trainingEndTime}"></td>
										<td th:text="*{blankTimeValue}"></td>
										<td th:text="*{statusDispName}"></td>

										<td th:if="${#strings.isEmpty(dailyAttendanceForm.note)}"><strong
												data-toggle="popover" data-placement="right" data-trigger="hover"
												data-original-title="" title="">なし</strong></td>
										<td th:unless="${#strings.isEmpty(dailyAttendanceForm.note)}"><strong
												data-toggle="popover" data-placement="right"
												th:data-content="${dailyAttendanceForm.note}" data-trigger="hover"
												data-original-title="" title="">あり</strong></td>
										<input type="hidden"
											th:name="|dailyAttendanceFormList[${stat.index}].lmsUserId|"
											th:value="*{lmsUserId}" />
										<input type="hidden" th:name="|dailyAttendanceFormList[${stat.index}].userName|"
											th:value="*{userName}" />
										<input type="hidden"
											th:name="|dailyAttendanceFormList[${stat.index}].courseName|"
											th:value="*{courseName}" />
										<input type="hidden"
											th:name="|dailyAttendanceFormList[${stat.index}].dispTrainingDate|"
											th:value="*{dispTrainingDate}" />
										<input type="hidden"
											th:name="|dailyAttendanceFormList[${stat.index}].trainingDate|"
											th:value="*{trainingDate}" />
										<input type="hidden" th:name="|dailyAttendanceFormList[${stat.index}].index|"
											th:value="${stat.index}" />
										<input type="hidden"
											th:name="|dailyAttendanceFormList[${stat.index}].trainingStartTimeRaw|"
											th:value="[未入力]" />
										<input type="hidden"
											th:name="|dailyAttendanceFormList[${stat.index}].trainingEndTimeRaw|"
											th:value="[未入力]" />
										<input type="hidden"
											th:name="|dailyAttendanceFormList[${stat.index}].blankTimeValue|"
											th:value="*{blankTimeValue}" />
										<input type="hidden"
											th:name="|dailyAttendanceFormList[${stat.index}].statusDispName|"
											th:value="*{statusDispName}" />
										<input type="hidden" th:name="|dailyAttendanceFormList[${stat.index}].note|"
											th:value="*{note}" />
										<input type="hidden"
											th:name="|dailyAttendanceFormList[${stat.index}].trainingStartTimeCopy|"
											th:value="*{trainingStartTimeCopy}"
											th:classappend="| startTimeCompanyRounded${stat.index}|" />
										<input type="hidden"
											th:name="|dailyAttendanceFormList[${stat.index}].trainingEndTimeCopy|"
											th:value="*{trainingEndTimeCopy}"
											th:classappend="| endTimeCompanyRounded${stat.index}|" />
										<th:block th:object="${bulkRegistForm}">
											<td>
												<input type="text"
													th:name="|dailyAttendanceFormList[${stat.index}].trainingStartTime|"
													value="" id="trainingStartTime" class="form-control"
													th:classappend="${#fields.hasErrors('dailyAttendanceFormList[' + stat.index + '].absent') or #fields.hasErrors('dailyAttendanceFormList[' + stat.index + '].trainingStartTime') or #fields.hasErrors('dailyAttendanceFormList[' + stat.index + '].trainingTimeFormat') or #fields.hasErrors('dailyAttendanceFormList[' + stat.index + '].trainingTimeRange')} ? ' errorInput' + | startTimeCompany${stat.index}|" />
											</td>
											<td>
												<input type="text"
													th:name="|dailyAttendanceFormList[${stat.index}].trainingEndTime|"
													value="" id="trainingEndTime" class="form-control"
													th:classappend="${#fields.hasErrors('dailyAttendanceFormList[' + stat.index + '].absent') or #fields.hasErrors('dailyAttendanceFormList[' + stat.index + '].trainingStartTime') or #fields.hasErrors('dailyAttendanceFormList[' + stat.index + '].trainingTimeFormat') or #fields.hasErrors('dailyAttendanceFormList[' + stat.index + '].trainingTimeRange')} ? ' errorInput' + | startTimeCompany${stat.index}|" />
											</td>
										</th:block>
										<td>
											<input type="checkbox"
												th:name="|dailyAttendanceFormList[${stat.index}].absent|" value="on"
												class="attendanceFormControl" />
										</td>
									</tr>
								</th:block>
							</tbody>
						</table>

					</form>
				</th:block>
			</div>
			<!--#main-->
		</div>
		<!--#contents-->
		<form id="screenTransForm" name="screenTransForm" method="post"></form>
		<div id="push"></div>
	</div>
	</div>

	<!--#container-->

</body>

</html>
